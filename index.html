<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Ops Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0a14;
      --surface: #13101c;
      --card: #1a1626;
      --border: #2a2040;
      --text: #f0eaf8;
      --text-secondary: #9580b8;
      --muted: #4a3a6a;
      --pink: #f472b6;
      --purple: #a78bfa;
      --rose: #fb7185;
      --peach: #fb923c;
      --mint: #34d399;
      --blue: #60a5fa;
      --yellow: #f59e0b;
    }

    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; line-height: 1.5; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

    .layout { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .hero {
      background: linear-gradient(135deg, #1e1235 0%, #150e2a 40%, #0d0a14 100%);
      border: 1px solid #3a2560; border-radius: 20px;
      padding: 2.5rem 3rem; margin-bottom: 2.5rem;
      position: relative; overflow: hidden;
    }
    .hero::before { content: ''; position: absolute; top: -60px; right: -60px; width: 280px; height: 280px; background: radial-gradient(circle, rgba(244,114,182,0.18) 0%, transparent 70%); pointer-events: none; }
    .hero::after { content: ''; position: absolute; bottom: -40px; left: 25%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(167,139,250,0.14) 0%, transparent 70%); pointer-events: none; }
    .hero-eyebrow { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.875rem; }
    .hero-eyebrow span { font-size: 0.7rem; font-weight: 700; color: var(--pink); text-transform: uppercase; letter-spacing: 0.12em; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
    .hero h1 { font-size: 2.25rem; font-weight: 800; color: #fff; margin-bottom: 0.625rem; line-height: 1.2; }
    .wave { display: inline-block; animation: wave 2s ease-in-out infinite; transform-origin: bottom right; }
    @keyframes wave { 0%,100%{transform:rotate(0deg)} 20%{transform:rotate(18deg)} 40%{transform:rotate(-8deg)} 60%{transform:rotate(14deg)} 80%{transform:rotate(-4deg)} }
    .hero p { color: #b09dc8; font-size: 0.9375rem; }

    .section-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.6875rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }

    .announcements { margin-bottom: 2.5rem; }
    .announcement { display: flex; align-items: center; gap: 1rem; background: rgba(244,114,182,0.07); border: 1px solid rgba(244,114,182,0.22); border-radius: 12px; padding: 0.875rem 1.25rem; margin-bottom: 0.625rem; transition: border-color 0.2s; }
    .announcement:hover { border-color: rgba(244,114,182,0.45); }
    .announcement-text { flex: 1; font-size: 0.875rem; color: #e0d0f0; }
    .announcement-date { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
    .dismiss-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 2px 4px; border-radius: 4px; transition: color 0.15s; display: flex; align-items: center; }
    .dismiss-btn:hover { color: var(--text); }

    .tools { margin-bottom: 2.5rem; }
    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 1rem; }
    .tool-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.375rem; cursor: pointer; text-decoration: none; color: inherit; display: block; transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s; }
    .tool-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
    .tool-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .tool-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
    .tool-tags { display: flex; gap: 0.375rem; flex-wrap: wrap; justify-content: flex-end; }
    .tag { font-size: 0.6rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
    .tool-name { font-weight: 700; font-size: 0.9375rem; color: var(--text); margin-bottom: 0.375rem; }
    .tool-desc { font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5; }
    .tool-link { display: flex; align-items: center; gap: 0.375rem; font-size: 0.8rem; font-weight: 600; margin-top: 1rem; transition: gap 0.15s; }
    .tool-card:hover .tool-link { gap: 0.625rem; }

    .gallery { margin-bottom: 2.5rem; }
    .slideshow-wrap {
      position: relative; border-radius: 20px; overflow: hidden;
      background: #0a0710; border: 1px solid #3a2a5a;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .slideshow { position: relative; width: 100%; height: 560px; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.9s ease; }
    .slide.active { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
    .slideshow::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, rgba(10,7,16,0.85) 100%); pointer-events: none; }
    .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 10; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.15s; }
    .slide-btn:hover { background: rgba(244,114,182,0.3); transform: translateY(-50%) scale(1.1); }
    .slide-prev { left: 1rem; }
    .slide-next { right: 1rem; }
